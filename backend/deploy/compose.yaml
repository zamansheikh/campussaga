# Production compose file. Copy to /opt/varsitykotha/deploy/compose.yaml on the
# VPS (docs/DEPLOYMENT.md). Secrets come from deploy/.env next to it.

# Containers: varsitykotha-postgres-1, -api-1, -nsfw-1, -web-1 (the project
# was "campussaga" until 2026-10-28).
name: varsitykotha
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campus
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 5s
      retries: 20
    # no ports: reachable only from the api container

  api:
    build: ../backend
    image: varsitykotha-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Campus Voice photo check (the nsfw service below).
      NSFW_URL: http://nsfw:8000
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:7030:8090"]
    # Firebase service-account key for push (FCM_CREDENTIALS_FILE), and the
    # Campus Voice photos (MEDIA_DIR=/data/media), served only by the API.
    volumes: ["./secrets:/run/secrets:ro", "media:/data/media"]
    # The privacy policy promises server logs are gone within 30 days:
    # cap them by size here, and the weekly cron in docs/DEPLOYMENT.md
    # (section "Log retention") wipes them by age.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Campus Voice photo check: an NSFW classifier (backend/nsfw) on our own
  # server, so students' photos never leave it. No published port: only the
  # API reaches it. If it is down, the API holds photos for moderators.
  nsfw:
    build: ../backend/nsfw
    image: varsitykotha-nsfw:latest
    restart: unless-stopped
    mem_limit: 600m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # varsitykotha.com: public pages + admin panel (apps/web, Next.js).
  # nginx proxies the site to 127.0.0.1:7031; the web server talks to the
  # API over the compose network. Deploy with deploy/deploy-web.sh.
  web:
    build: ../web
    image: varsitykotha-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7031"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:8090/api/v1
      SITE_URL: https://varsitykotha.com
    # One replica only: token refreshes are merged in this process's memory.
    depends_on: [api]
    ports: ["127.0.0.1:7031:7031"]
    # Shared VPS: keep the Node server small.
    mem_limit: 384m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

# varsitykotha_pgdata and varsitykotha_media. Renaming the project renames
# these too, to new empty volumes: copy the data first (docs/DEPLOYMENT.md).
volumes:
  pgdata:
  media:
