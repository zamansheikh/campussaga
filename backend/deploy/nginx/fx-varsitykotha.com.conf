# VarsityKotha web: public pages + admin panel (varsitykotha.com).
# /api/ -> the Go API (docker compose project "varsitykotha", 127.0.0.1:7030),
#          same origin as the pages, so the browser needs no CORS.
# /     -> the Next.js container (apps/web, 127.0.0.1:7031).
# www.varsitykotha.com and the old campus.silifton.com redirect here.
# DNS on Cloudflare, DNS only (not proxied), like the API.
# Installed at /etc/nginx/sites-available/fx-varsitykotha.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name varsitykotha.com www.varsitykotha.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://varsitykotha.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.varsitykotha.com;
    ssl_certificate /etc/letsencrypt/live/varsitykotha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/varsitykotha.com/privkey.pem;
    return 301 https://varsitykotha.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name varsitykotha.com;
    ssl_certificate /etc/letsencrypt/live/varsitykotha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/varsitykotha.com/privkey.pem;
    client_max_body_size 1m;

    # The Go API sets its own security headers.
    location /api/ {
        proxy_pass http://127.0.0.1:7030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The site and admin panel. It sends its own security headers; HSTS is
    # added here.
    location / {
        proxy_pass http://127.0.0.1:7031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
