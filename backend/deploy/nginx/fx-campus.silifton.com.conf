# VarsityKotha web: public pages + admin panel (campus.silifton.com).
# /api/ -> the Go API (docker compose project "campussaga", 127.0.0.1:7030),
#          same origin as the pages, so the browser needs no CORS.
# /     -> for now the static pages in /opt/campussaga/web-static (repo site/);
#          later the Next.js container (apps/web, 127.0.0.1:7031): see below.
# Direct DNS (not Cloudflare-proxied), like api-campus.silifton.com.
# Installed at /etc/nginx/sites-available/fx-campus.silifton.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name campus.silifton.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name campus.silifton.com;
    ssl_certificate /etc/letsencrypt/live/campus.silifton.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.silifton.com/privkey.pem;
    client_max_body_size 1m;

    # The Go API sets its own security headers.
    location /api/ {
        proxy_pass http://127.0.0.1:7030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The site and admin panel: apps/web (Next.js) in the campussaga
    # compose project. It sends its own security headers; HSTS is added here.
    location / {
        proxy_pass http://127.0.0.1:7031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # Fallback while the web container is down: the old static pages.
    # location / {
    #     root /opt/campussaga/web-static;
    #     index index.html;
    #     try_files $uri $uri.html $uri/ =404;
    # }
}
