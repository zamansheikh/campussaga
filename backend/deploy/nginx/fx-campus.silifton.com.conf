# Old web address (campus.silifton.com): redirects to https://varsitykotha.com,
# keeping the path, so links in older app builds (privacy page, delete
# account) and bookmarks keep working. The site itself is
# fx-varsitykotha.com.conf.
# Direct DNS (not Cloudflare-proxied), like api-campus.silifton.com.
# Installed at /etc/nginx/sites-available/fx-campus.silifton.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name campus.silifton.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://varsitykotha.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name campus.silifton.com;
    ssl_certificate /etc/letsencrypt/live/campus.silifton.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.silifton.com/privkey.pem;
    return 301 https://varsitykotha.com$request_uri;
}
