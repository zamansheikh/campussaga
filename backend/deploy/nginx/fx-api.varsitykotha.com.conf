# VarsityKotha API -> docker compose project "campussaga" (127.0.0.1:7030).
# DNS only on Cloudflare (not proxied): proxying adds ~400 ms per call from BD.
# The old api-campus.silifton.com stays up for app builds that still use it.
# Installed at /etc/nginx/sites-available/fx-api.varsitykotha.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name api.varsitykotha.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.varsitykotha.com;
    ssl_certificate /etc/letsencrypt/live/api.varsitykotha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.varsitykotha.com/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:7030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
