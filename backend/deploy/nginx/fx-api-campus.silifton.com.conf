# Campus Saga API (beta) -> docker compose project "campussaga" (127.0.0.1:7030).
# Direct DNS (not Cloudflare-proxied): proxying adds ~400 ms per call from BD.
server {
    listen 80;
    listen [::]:80;
    server_name api-campus.silifton.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-campus.silifton.com;
    ssl_certificate /etc/letsencrypt/live/api-campus.silifton.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-campus.silifton.com/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:7030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
