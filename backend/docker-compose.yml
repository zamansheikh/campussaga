# Local development + test dependencies. Ports never collide with the other
# backends on this Mac (gamebackend :55532, zimolive :55432).
#
#   make deps-up     # start
#   make deps-down   # stop (data kept)
name: campussaga

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    # fsync/synchronous_commit off: dev/test speed only. Never in production.
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports: ["55632:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 2s
      retries: 30

  # Catches every email sent in development: http://localhost:58025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["55625:1025", "58025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
