# sqlc config for this module. Regenerate with `make sqlc` (all modules).
# The overrides block is identical in every module; copy it verbatim.
version: "2"
sql:
  - engine: postgresql
    schema: ../../../migrations
    queries: store/queries.sql
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - {db_type: uuid, go_type: github.com/google/uuid.UUID}
          - {db_type: uuid, nullable: true, go_type: {import: github.com/google/uuid, type: UUID, pointer: true}}
          - {db_type: timestamptz, go_type: time.Time}
          - {db_type: timestamptz, nullable: true, go_type: {import: time, type: Time, pointer: true}}
          - {db_type: jsonb, go_type: encoding/json.RawMessage}
          - {db_type: jsonb, nullable: true, go_type: encoding/json.RawMessage}
          # Only this module: calendar dates (routine changes).
          - {db_type: date, go_type: time.Time}
          - {db_type: date, nullable: true, go_type: {import: time, type: Time, pointer: true}}
