name: campus_ui
description: Design system - tokens, themes and shared components.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  phosphoricons_flutter: 1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # The VarsityKotha mark (CsBrandMark), 1x/2x/3x.
  assets:
    - assets/brand/
  # Noto Sans Bengali (SIL Open Font License, fonts/NotoSansBengali/OFL.txt),
  # bundled so Bangla renders the same on every phone. Used as the fallback
  # font: Latin text keeps the platform font.
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: fonts/NotoSansBengali/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansBengali/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: fonts/NotoSansBengali/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSansBengali/NotoSansBengali-Bold.ttf
          weight: 700
