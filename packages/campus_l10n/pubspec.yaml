name: campus_l10n
description: English and Bangla strings. Edit the ARB files, then run `flutter gen-l10n` in this folder.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
