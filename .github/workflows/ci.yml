name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check translations are generated
        run: |
          (cd packages/campus_l10n && flutter gen-l10n)
          git diff --exit-code packages/campus_l10n/lib/src/generated

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: ./tool/test_all.sh

  android:
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - name: Firebase Android config (from the GOOGLE_SERVICES_JSON secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the repository secret GOOGLE_SERVICES_JSON (contents of google-services.json)"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus
        ports: ["55632:5432"]
        options: >-
          --health-cmd "pg_isready -U campus"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'
      - name: Generated code is up to date
        run: |
          make sqlc
          git diff --exit-code -- internal
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: vet
        run: go vet ./...
      - name: Tests (race, fresh database per test)
        env:
          TEST_DATABASE_URL: postgres://campus:campus@localhost:55632/campus?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Docker image builds
        run: docker build -t campusapi:ci .
