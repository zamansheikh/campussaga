name: campussaga
description: "Student app: class routine, reminders and campus voice."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  campus_core:
  campus_data:
  campus_l10n:
  campus_ui:
  equatable: ^3.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
